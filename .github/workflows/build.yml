name: Build Yahya Stealth Blink

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Single File EXE
      run: dotnet publish Project.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yahya-Stealth-Blink-EXE
        path: bin/Release/net8.0-windows/win-x64/publish/
        
